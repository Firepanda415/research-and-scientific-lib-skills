schema_version: "1.1"
name: scicode-debug-computation
description: >-
  A fix for one scientific computation. The user asks for a corrected function, not a
  review.
tags: [routing, scientific-code]
execution:
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
  prompt: |
    This function should return the expectation value of Z0 Z1, the product of Z on the first two qubits of a three-qubit register. The count keys are bitstrings with qubit 0 as the rightmost character. For some inputs it returns values above 1. Find the bug and give me a corrected function.

    ```python
    def zz_expectation(counts):
        total = sum(counts.values())
        value = 0.0
        for bits, n in counts.items():
            parity = bits.count("1") % 2
            value += (1 - 2 * parity) * n
        return value / len(counts)
    ```
graders:
  - name: calls-scientific-computing-correctness
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?scientific-computing-correctness"'
    min: 1
  - name: skips-scientific-library-review
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?scientific-library-review"'
    min: 0
    max: 0
    arm: both
  - name: skips-deep-code-review
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?deep-code-review"'
    min: 0
    max: 0
    arm: both
