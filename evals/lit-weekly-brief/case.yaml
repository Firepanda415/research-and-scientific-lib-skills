schema_version: "1.1"
name: lit-weekly-brief
description: >-
  A catch-up on recent quantum papers. It asks for a selective briefing, not an answer
  to a research question.
tags: [routing, literature]
execution:
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
  prompt: |
    Catch me up on quantum error-correction decoding from the past week. I only want the three or four new papers that are actually worth my time, with a line on why each one matters.
graders:
  - name: calls-quantum-research-radar
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?quantum-research-radar"'
    min: 1
  - name: skips-upgrade-research-inputs
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?upgrade-research-inputs"'
    min: 0
    max: 0
    arm: both
