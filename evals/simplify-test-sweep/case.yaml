schema_version: "1.1"
name: simplify-test-sweep
description: >-
  A read-only sweep of a library's test directory for low-value and duplicated
  tests and the test-only seams they keep alive belongs to the simplification
  workflow, not to a code-review skill. Ponytail is left ungraded.
tags: [routing, simplification]
execution:
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
  prompt: |
    我们 Python 库的 tests/ 目录这两年堆了不少没价值的测试：有的只是调用一下不断言，有的期望值直接从被测函数算出来，还有一个 `_reset_cache()` 只有测试在用。帮我把整个 tests/ 扫一遍，列出可以删或合并的测试，以及能跟着一起删掉的生产代码。先只出清单，不要改文件。
graders:
  - name: calls-simplify-codebase
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?simplify-codebase"'
    min: 1
  - name: skips-deep-code-review
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?deep-code-review"'
    min: 0
    max: 0
    arm: both
  - name: skips-scientific-library-review
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?scientific-library-review"'
    min: 0
    max: 0
    arm: both
