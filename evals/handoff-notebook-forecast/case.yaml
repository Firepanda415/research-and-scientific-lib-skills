schema_version: "1.1"
name: handoff-notebook-forecast
description: >-
  An observation and a forecast written before the outcome is known. Memory, resume
  state and an implementer brief are near misses.
tags: [routing, handoff]
execution:
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
  prompt: |
    Add today's entry to my lab notebook. At a physical error rate of 0.008 the logical error rate stopped falling and flattened near 3e-4 as the code distance went from 5 to 9. I suspect leakage but haven't checked. The 0.006 run finishes tonight, so before I see it, also write down what I expect it to show so I can't rationalize the result afterwards. Just draft the entry here.
graders:
  - name: calls-write-research-log
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?write-research-log"'
    min: 1
  - name: skips-research-watchdog-protocol
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?research-watchdog-protocol"'
    min: 0
    max: 0
    arm: both
  - name: skips-maintain-project-memory
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?maintain-project-memory"'
    min: 0
    max: 0
    arm: both
  - name: skips-write-implementation-job-prompts
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?write-implementation-job-prompts"'
    min: 0
    max: 0
    arm: both
