schema_version: "1.1"
name: scicode-general-review
description: >-
  Ordinary application code from a research lab. It computes no scientific quantity,
  so neither scientific skill applies.
tags: [routing, scientific-code]
execution:
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
  prompt: |
    Please review this helper from our lab's data-upload service before I merge it. I care about real bugs and missing tests, not style.

    ```python
    import time
    import requests

    def upload(record, url, retries=3):
        for attempt in range(retries):
            try:
                response = requests.post(url, json=record, timeout=5)
                if response.status_code == 200:
                    return response.json()
            except requests.RequestException:
                time.sleep(2 ** attempt)
        return None
    ```
graders:
  - name: calls-deep-code-review
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?deep-code-review"'
    min: 1
  - name: skips-scientific-library-review
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?scientific-library-review"'
    min: 0
    max: 0
    arm: both
  - name: skips-scientific-computing-correctness
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?scientific-computing-correctness"'
    min: 0
    max: 0
    arm: both
