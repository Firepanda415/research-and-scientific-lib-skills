schema_version: "1.1"
name: direction-intro-for-settled-result
description: >-
  A settled result whose paper Introduction needs a structure. The decision to write it up is
  already made, so idea development does not apply.
tags: [routing, direction]
execution:
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
  prompt: |
    结果已经定了：我们的张量网络方法把二维横场 Ising 模型的临界场算到了小数点后 6 位。准备投 PRB，帮我把 Introduction 的逻辑链搭起来，先给提纲，不用写正文。
graders:
  - name: skips-develop-research-ideas
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?develop-research-ideas"'
    min: 0
    max: 0
    arm: both
