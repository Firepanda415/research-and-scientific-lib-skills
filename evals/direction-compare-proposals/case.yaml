schema_version: "1.1"
name: direction-compare-proposals
description: >-
  A choice between two new projects. No current direction is in question, so idea
  development applies and rethinking does not.
tags: [routing, direction]
execution:
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
  prompt: |
    I have six months left on my postdoc and access only to simulators. I'm choosing between two projects: (a) learned decoders for bosonic codes, or (b) a shot-budget-matched comparison of error-mitigation methods on small chemistry Hamiltonians. Which is more worth doing, and why? A few paragraphs is plenty.
graders:
  - name: calls-develop-research-ideas
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?develop-research-ideas"'
    min: 1
  - name: skips-rethink-design
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?rethink-design"'
    min: 0
    max: 0
    arm: both
