schema_version: "1.1"
name: simplify-ponytail-off
description: >-
  A simplification request follows an explicit Ponytail opt-out. The task still
  needs the simplification workflow without reactivating its companion.
tags: [routing, simplification]
execution:
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
  prompt: |
    Turn Ponytail off for this session. Now review this deletion proposal for our command-line app, without editing files. The proposal removes unused private helpers, combines two duplicate configuration parsers, and retires a public wrapper used only by an old example. Tell me what caller evidence and migration checks you need before recommending these changes.
graders:
  - name: calls-simplify-codebase
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?simplify-codebase"'
    min: 1
  - name: skips-ponytail
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?ponytail"'
    min: 0
    max: 0
    arm: both
