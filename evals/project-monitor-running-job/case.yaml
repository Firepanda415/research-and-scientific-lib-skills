schema_version: '1.1'
name: project-monitor-running-job
description: Watching a cluster job while the user is away belongs to research-watchdog-protocol, not
  to the project workflow.
tags:
- routing
- project
execution:
  max_turns: 8
  timeout_seconds: 240
  allowed_tools:
  - Skill
  prompt: '我今晚不在，帮我盯着集群上 SLURM job 48213 的训练，卡住或者失败了就提醒我。

    '
graders:
- name: calls-research-watchdog-protocol
  type: tool_used
  tool: Skill
  input_match: '"(?:research-skills:)?research-watchdog-protocol"'
  min: 1
- name: skips-lead-multi-agent-project
  type: tool_used
  tool: Skill
  input_match: '"(?:research-skills:)?lead-multi-agent-project"'
  min: 0
  max: 0
  arm: both
