schema_version: "1.1"
name: scicode-library-remediation
description: >-
  A numerical-library review must choose a repair and where it belongs. The
  scientific review owns correctness, with Ponytail guiding the code decision.
tags: [routing, scientific-code]
execution:
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
  prompt: |
    We found that our numerical library's sparse solver and dense solver return eigenvectors with different normalization conventions. Two public analysis functions then report inconsistent expectation values, although their tests pass. The proposed repair adds a normalization adapter in each analysis function and a third adapter in serialization. Decide whether those adapters belong there or whether we should change the solver result contract, and specify checks that could expose a wrong repair. I want your review and repair recommendation before anyone changes code.
graders:
  - name: calls-scientific-library-review
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?scientific-library-review"'
    min: 1
  - name: calls-ponytail
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?ponytail"'
    min: 1
  - name: skips-deep-code-review
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?deep-code-review"'
    min: 0
    max: 0
    arm: both
  - name: skips-scientific-computing-correctness
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?scientific-computing-correctness"'
    min: 0
    max: 0
    arm: both
