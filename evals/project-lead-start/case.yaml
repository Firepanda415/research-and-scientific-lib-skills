schema_version: '1.1'
name: project-lead-start
description: The user asks this session to lead a release in their own words. Leading a multi-agent project
  belongs to lead-multi-agent-project; monitoring and the writing route are near misses.
tags:
- routing
- project
execution:
  max_turns: 8
  timeout_seconds: 240
  allowed_tools:
  - Skill
  prompt: '你来当 qdemo 0.3 的主脑，计划草稿在 plans/PLAN-0.3.md，按我们的流程开始推进。

    '
graders:
- name: calls-lead-multi-agent-project
  type: tool_used
  tool: Skill
  input_match: '"(?:research-skills:)?lead-multi-agent-project"'
  min: 1
- name: skips-research-watchdog-protocol
  type: tool_used
  tool: Skill
  input_match: '"(?:research-skills:)?research-watchdog-protocol"'
  min: 0
  max: 0
  arm: both
- name: skips-research-writing-style
  type: tool_used
  tool: Skill
  input_match: '"(?:research-skills:)?research-writing-style"'
  min: 0
  max: 0
  arm: both
