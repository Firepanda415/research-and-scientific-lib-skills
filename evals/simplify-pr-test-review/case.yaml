schema_version: "1.1"
name: simplify-pr-test-review
description: >-
  Acceptance review of one pull request to a scientific library, judged on
  whether its new tests are independent evidence, is a library review, not a
  simplification sweep, even though it asks whether the tests are worth keeping.
tags: [routing, simplification]
execution:
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
  prompt: |
    Please review this PR to our Trotter simulation library before I merge it. It adds the step-count bound below and two tests for it. Are the tests independent evidence that the bound is right, and are they worth keeping? Do not change anything, just tell me what you find.

    ```python
    # trotter/steps.py
    import math


    def trotter_steps(norm_h, t, eps):
        """Second-order Trotter steps for error at most eps: steps >= (norm_h * t) ** 1.5 / eps ** 0.5."""
        return math.ceil((norm_h * t) ** 1.5 / eps ** 0.5)
    ```

    ```python
    # tests/test_steps.py
    import math

    from trotter.steps import trotter_steps


    def test_matches_formula():
        norm_h, t, eps = 2.0, 3.0, 1e-4
        assert trotter_steps(norm_h, t, eps) == math.ceil((norm_h * t) ** 1.5 / eps ** 0.5)


    def test_hand_computed_case():
        # norm_h * t = 4, so 4 ** 1.5 = 8; eps = 1e-2 gives 8 / 0.1 = 80
        assert trotter_steps(2.0, 2.0, 1e-2) == 80
    ```
graders:
  - name: calls-scientific-library-review
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?scientific-library-review"'
    min: 1
  - name: skips-simplify-codebase
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?simplify-codebase"'
    min: 0
    max: 0
    arm: both
