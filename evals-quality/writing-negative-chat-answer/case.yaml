schema_version: "1.1"
name: writing-negative-chat-answer
description: >-
  A temporary chat answer that should not load the writing route.
tags: [quality, writing, negative]
execution:
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Read, Skill]
  prompt: |
    In two sentences, what does a Toffoli gate do? This is just for me right now, not for a document.
graders:
  - name: skips-research-writing-style
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?research-writing-style"'
    min: 0
    max: 0
    arm: both
  - name: skips-reading-research-writing-style
    type: tool_used
    tool: Read
    input_match: 'skills/research-writing-style/SKILL\.md'
    min: 0
    max: 0
    arm: both
  - name: answers-the-question
    type: regex
    pattern: 'control|target|flip|AND'
    flags: i
    match: contains
