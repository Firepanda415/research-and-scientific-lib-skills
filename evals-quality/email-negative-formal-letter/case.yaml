schema_version: "1.1"
name: email-negative-formal-letter
description: >-
  A recommendation letter, which is formal correspondence and should use the full writing route.
tags: [quality, email, negative]
execution:
  max_turns: 12
  timeout_seconds: 600
  allowed_tools: [Read, Skill]
  prompt: |
    Write a one-page recommendation letter for my former student Jordan Lee, who is applying to PhD programs in quantum computing. Points: two years in my group, led the benchmark study of QHD solvers, first author on a workshop paper, strong independent problem solver. Reply with only the letter.
graders:
  - name: loads-research-writing-style
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?research-writing-style"'
    min: 1
  - name: reads-research-writing-style
    type: tool_used
    tool: Read
    input_match: 'skills/research-writing-style/SKILL\.md'
    min: 1
    arm: with-only
  - name: skips-work-email
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?work-email"'
    min: 0
    max: 0
    arm: both
  - name: skips-reading-work-email
    type: tool_used
    tool: Read
    input_match: 'skills/work-email/SKILL\.md'
    min: 0
    max: 0
    arm: both
  - name: supported-claims-only
    type: llm
    criteria: >-
      The letter uses only these supplied points about Jordan Lee: two years in the writer's research group, led the group's benchmark study of QHD solvers, first author on a workshop paper, and a strong independent problem solver. It invents no other achievements, publications, rankings, anecdotes or traits. Clearly marked placeholders for details the writer must add are acceptable.
  - name: no-semicolons
    type: regex
    pattern: '[;；]'
    match: not_contains
  - name: no-em-dashes
    type: regex
    pattern: '—'
    match: not_contains
  - name: no-banned-words
    type: regex
    pattern: '\b(retain(s|ed|ing)?|honest(ly)?)\b'
    flags: i
    match: not_contains
  - name: no-process-leakage
    type: regex
    pattern: '(as (you )?requested|per your (request|instructions)|as instructed|you asked|I (have )?(revised|rewrote|rewritten|edited|corrected|fixed)|here(''s| is) (the|your|a) (revised|updated|rewritten|corrected|final))'
    flags: i
    match: not_contains
