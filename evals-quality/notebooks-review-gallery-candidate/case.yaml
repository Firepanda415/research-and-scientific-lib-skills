schema_version: "1.1"
name: notebooks-review-gallery-candidate
description: >-
  Newcomer-oriented review of a library example notebook with theory before the call, a hidden input cell, a mislabeled output quantity, a hard-coded result sentence and an unexecuted cell that fails, testing first-screen, labeling and execution-evidence checks.
tags: [quality, tier3, library-example-notebooks]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    A student wrote examples/hhl_demo.ipynb for our qlsolve package, and we'd like to add it to the example gallery. 请从一个第一次接触这个库的用户的角度 review 一下这个 notebook。Reply with your findings in chat, at most about 350 words, and don't edit any files. python3 (standard library only) is available; `python3 -m unittest` runs the library tests.
graders:
  - name: loads-library-example-notebooks
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?library-example-notebooks"'
    min: 1
  - name: reads-library-example-notebooks
    type: tool_used
    tool: Read
    input_match: 'skills/library-example-notebooks/SKILL\.md'
    min: 1
    arm: with-only
  - name: flags-direction-labeled-as-solution
    type: llm
    weight: 2
    criteria: >-
      Context: in the reviewed notebook, a cell prints "solution x =" followed by res.direction, and a later Markdown cell refers to "the solution x shown above". In the qlsolve library, res.direction is the normalized state x / ||x|| (unit norm); the physical solution is res.solution() = res.norm * res.direction. For the notebook's system the printed values are about [0.964, -0.258, 0.069, -0.017], while the physical solution is about [0.268, -0.072, 0.019, -0.005]. PASS if the review says the printed or described quantity is the normalized direction rather than the physical solution x (or equivalently that the label is wrong or the norm is missing). FAIL if it does not identify this mislabeling.
  - name: flags-hardcoded-success-probability
    type: llm
    criteria: >-
      Context: a Markdown cell in the reviewed notebook states "The solver succeeds with probability 0.92", but the notebook's stored output shows success_probability = 0.4388 (about 0.44) for the same run. The Markdown sentence is typed by hand, not computed from the run. PASS if the review points out that the stated 0.92 disagrees with the computed success probability of about 0.44, or that the sentence is hard-coded and does not match the run. FAIL if it does not raise this mismatch.
  - name: flags-unexecuted-failing-sweep
    type: llm
    criteria: >-
      Context: the reviewed notebook's "Scaling" cell loops over system sizes [2, 4, 8, 16, 32] and calls solve, but the library's MAX_DIM is 16, so the call with size 32 raises ValueError. The cell has no stored output and no execution count, meaning it was never run. The Markdown above it claims the success probability "stays high as the system grows", while the actual values for sizes 2, 4, 8 and 16 are about 0.68, 0.44, 0.35 and 0.32. PASS if the review reports that the scaling cell fails (or would fail) at size 32 because of the 16-dimension limit, or that it was never executed, or that its claim contradicts the decreasing values. FAIL if none of these is raised.
  - name: flags-first-screen-and-template
    type: llm
    criteria: >-
      Context: the reviewed example notebook opens with three Markdown cells of HHL theory before any code. The first visible call, res = solve(A, b), depends on a collapsed (source-hidden) cell that holds the imports and defines A and b, so a newcomer cannot see the inputs of the call. The notebook has no cell showing how a reader would substitute their own matrix and vector, and it does not state the input requirements (real symmetric, dimension a power of two up to 16) next to the example. PASS if the review raises at least two of these: theory before the first call, the call depending on a hidden cell, the missing template for the reader's own problem, and the missing input format or size limits. FAIL if it raises fewer than two.
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
