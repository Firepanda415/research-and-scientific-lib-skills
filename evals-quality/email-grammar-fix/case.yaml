schema_version: "1.1"
name: email-grammar-fix
description: >-
  A grammar fix of a short work email that must keep its facts, greeting and sign-off.
tags: [quality, email]
execution:
  max_turns: 12
  timeout_seconds: 600
  allowed_tools: [Read, Skill]
  prompt: |
    Fix the grammar in my email and reply with only the email.

    Hi Priya,

    Thanks for sending the draft. I have went through section 3 and the numbers in table 2 looks right, but the caption say 12 qubits while the text use 14. Could you check which one is correct before friday? I can joins a call on Thursday at 2 pm if that help.

    Best,
    Alex
graders:
  - name: loads-work-email
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?work-email"'
    min: 1
  - name: reads-work-email
    type: tool_used
    tool: Read
    input_match: 'skills/work-email/SKILL\.md'
    min: 1
    arm: with-only
  - name: skips-research-writing-style
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?research-writing-style"'
    min: 0
    max: 0
  - name: skips-reading-research-writing-style
    type: tool_used
    tool: Read
    input_match: 'skills/research-writing-style/SKILL\.md'
    min: 0
    max: 0
    arm: with-only
  - name: keeps-12
    type: regex
    pattern: '\b12 qubits'
    match: contains
  - name: keeps-14
    type: regex
    pattern: '\b14\b'
    match: contains
  - name: keeps-thursday-2pm
    type: regex
    pattern: 'Thursday at 2'
    match: contains
  - name: keeps-friday
    type: regex
    pattern: 'Friday'
    flags: i
    match: contains
  - name: keeps-greeting
    type: regex
    pattern: 'Hi Priya'
    match: contains
  - name: keeps-sign-off
    type: regex
    pattern: 'Best,\s*\n\s*Alex'
    match: contains
  - name: grammar-only
    type: llm
    criteria: >-
      The text is the original email below with only grammar and capitalization corrected (for example went to gone, looks to look, say to says, use to uses, joins to join, help to helps, friday to Friday). The content, tone and length are otherwise unchanged. Original email: "Hi Priya, Thanks for sending the draft. I have went through section 3 and the numbers in table 2 looks right, but the caption say 12 qubits while the text use 14. Could you check which one is correct before friday? I can joins a call on Thursday at 2 pm if that help. Best, Alex"
  - name: no-semicolons
    type: regex
    pattern: '[;；]'
    match: not_contains
  - name: no-em-dashes
    type: regex
    pattern: '—'
    match: not_contains
  - name: no-banned-words
    type: regex
    pattern: '\b(retain(s|ed|ing)?|honest(ly)?)\b'
    flags: i
    match: not_contains
  - name: no-process-leakage
    type: regex
    pattern: '(as (you )?requested|per your (request|instructions)|as instructed|you asked|I (have )?(revised|rewrote|rewritten|edited|corrected|fixed)|here(''s| is) (the|your|a) (revised|updated|rewritten|corrected|final))'
    flags: i
    match: not_contains
