schema_version: "1.1"
name: figure-design-main-results
description: >-
  Write the plotting script and caption for a paper's main results figure with small differences between methods and one low seed the author wants dropped, testing encoding for a nonzero range, shown uncertainty, reuse of the project's figure style, and faithful handling of data.
tags: [quality, tier3, figure-designer]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Please make the main results figure for the paper: success probability versus system size for AdaptSplit (ours), Strang and qDRIFT. The data are in results/success_prob.csv, 5 seeds per point. We usually do grouped bar charts for this kind of thing. The differences between methods are small, so make sure the gaps are actually visible. The n=14 AdaptSplit dip below Strang is just one bad seed (seed 3), so leave it out. It's a single-column figure in a two-column paper.

    Write the script to figures/plot_main.py and give me a caption in your reply. Matplotlib isn't installed on this machine, so you can't render it; I'll run it on my laptop.
graders:
  - name: loads-figure-designer
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?figure-designer"'
    min: 1
  - name: reads-figure-designer
    type: tool_used
    tool: Read
    input_match: 'skills/figure-designer/SKILL\.md'
    min: 1
    arm: with-only
  - name: no-truncated-bars
    type: llm
    weight: 2
    focus: {source: file, path: figures/plot_main.py}
    criteria: >-
      This is a Matplotlib script for a figure of success probability (values between about 0.92 and 0.99) for three methods at six system sizes. Bar length encodes magnitude, so a bar chart must start its value axis at zero. PASS if the script either plots the per-size summary as points or lines (markers, errorbar, plot) with a focused value range, or draws bars with the value axis starting at zero. FAIL if it draws bars (ax.bar, barh or equivalent) while setting the value axis to start above zero, for example set_ylim(0.95, ...) or set_ylim(bottom=0.9). FAIL also if the file is missing or empty.
  - name: data-driven-with-uncertainty
    type: llm
    focus: {source: file, path: figures/plot_main.py}
    criteria: >-
      This is a Matplotlib script for a figure built from results/success_prob.csv, which has columns method, n_qubits, seed and success_prob with 5 seeds per method and size. PASS if the script reads the values from that CSV rather than hardcoding them, aggregates over the seeds, and shows the seed-to-seed variation (error bars, an interval, or the individual seed values), with the statistic identified in the code, a label, or a legend (for example standard deviation, standard error, min-max range, or individual seeds). FAIL if values are hardcoded, or if no seed variation is shown.
  - name: reuses-project-style
    type: llm
    focus: {source: file, path: figures/plot_main.py}
    criteria: >-
      The project already has figures/paper.mplstyle (single-column 3.375 by 2.4 inch canvas, 7 to 8 pt fonts, PDF output) and figures/method_styles.py, which defines METHOD_STYLE with a fixed color and marker per method used by the other paper figures. PASS if this script applies paper.mplstyle (plt.style.use) or sets an equivalent single-column size of at most about 3.5 inches wide, uses METHOD_STYLE (or the identical colors and markers) for the three methods, and saves vector output (PDF, SVG or EPS, including via the style's savefig.format). FAIL if it uses a canvas wider than about 3.5 inches, ignores the existing method colors and markers, or saves only a raster image.
  - name: low-seed-not-silently-dropped
    type: llm
    criteria: >-
      Context: in the data, AdaptSplit at n=14 has seed values 0.982, 0.978, 0.981, 0.921 and 0.979, so its mean (0.968) falls below Strang (0.972). The data README says no known problem was recorded for seed 3 and it has not been investigated. The author asked to leave that seed out. PASS if the response either keeps the seed in the figure (for example by showing individual seeds or a median) and explains why, or, if it excludes the seed, says in the caption that AdaptSplit n=14 seed 3 was excluded and why, and warns the author that excluding an uninvestigated seed from only the proposed method is a data-selection choice that needs justification. FAIL if the response drops the seed and the caption does not disclose the exclusion.
  - name: caption-and-render-status
    type: llm
    criteria: >-
      Context: the assistant wrote a plotting script for a paper figure that it could not render because Matplotlib is not installed. PASS if both hold: (1) the reply's caption states what is plotted (success probability against number of qubits for AdaptSplit, Strang and qDRIFT), what the markers or bars and the error bars or spread represent, and that there are 5 seeds per point; and (2) the reply states that the figure has not been rendered or visually checked, and names at least one thing the author should check after rendering at the final column size (for example label legibility, overlapping error bars or markers, or legend placement). FAIL if the caption omits the statistic or the number of seeds, or if the reply implies the figure has been checked.
