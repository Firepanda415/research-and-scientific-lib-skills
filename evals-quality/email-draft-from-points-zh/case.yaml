schema_version: "1.1"
name: email-draft-from-points-zh
description: >-
  A short English email drafted from Chinese points, with one item to leave out.
tags: [quality, email]
execution:
  max_turns: 12
  timeout_seconds: 600
  allowed_tools: [Read, Skill]
  prompt: |
    帮我给 Dr. Chen 写一封简短的英文邮件：感谢他上周的讨论；想约下周二或周三下午 30 分钟的会，讨论 benchmark 的实验设计；附上了我们的计划草稿（PLAN.md）。不要提我们的截止日期。只给邮件正文。
graders:
  - name: loads-work-email
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?work-email"'
    min: 1
  - name: reads-work-email
    type: tool_used
    tool: Read
    input_match: 'skills/work-email/SKILL\.md'
    min: 1
    arm: with-only
  - name: skips-research-writing-style
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?research-writing-style"'
    min: 0
    max: 0
  - name: skips-reading-research-writing-style
    type: tool_used
    tool: Read
    input_match: 'skills/research-writing-style/SKILL\.md'
    min: 0
    max: 0
    arm: with-only
  - name: proposes-days
    type: regex
    pattern: 'Tuesday.*Wednesday|Wednesday.*Tuesday'
    flags: s
    match: contains
  - name: keeps-30-minutes
    type: regex
    pattern: '30[- ]min'
    match: contains
  - name: mentions-plan
    type: regex
    pattern: 'PLAN\.md'
    match: contains
  - name: no-deadline
    type: regex
    pattern: 'deadline|due date'
    flags: i
    match: not_contains
  - name: no-chinese-in-output
    type: regex
    pattern: '[\u4e00-\u9fff]'
    match: not_contains
  - name: short-and-complete
    type: llm
    criteria: >-
      A short, polite email that thanks Dr. Chen for last week's discussion, proposes a 30-minute meeting next Tuesday or Wednesday afternoon about the benchmark experiment design, mentions the attached plan, and adds no other commitment or content.
  - name: no-semicolons
    type: regex
    pattern: '[;；]'
    match: not_contains
  - name: no-em-dashes
    type: regex
    pattern: '—'
    match: not_contains
  - name: no-banned-words
    type: regex
    pattern: '\b(retain(s|ed|ing)?|honest(ly)?)\b'
    flags: i
    match: not_contains
  - name: no-process-leakage
    type: regex
    pattern: '(as (you )?requested|per your (request|instructions)|as instructed|you asked|I (have )?(revised|rewrote|rewritten|edited|corrected|fixed)|here(''s| is) (the|your|a) (revised|updated|rewritten|corrected|final))'
    flags: i
    match: not_contains
