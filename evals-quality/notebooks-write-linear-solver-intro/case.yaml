schema_version: "1.1"
name: notebooks-write-linear-solver-intro
description: >-
  Writing a first example notebook for a small HHL-emulator library, testing a complete minimal call on the first screen, a separate template for the reader's own system, labeled output quantities and modes, and stored outputs from an actual run.
tags: [quality, tier3, library-example-notebooks]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    qlsolve 还没有 example notebook。Please write an introductory example notebook, examples/getting_started.ipynb, for new users, for example physicists who want to try the package on a small linear system from their own work. Keep it short. Only python3 with the standard library is available in this environment (no Jupyter). Library tests: `python3 -m unittest`. When done, tell me briefly what the notebook contains.
graders:
  - name: loads-library-example-notebooks
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?library-example-notebooks"'
    min: 1
  - name: reads-library-example-notebooks
    type: tool_used
    tool: Read
    input_match: 'skills/library-example-notebooks/SKILL\.md'
    min: 1
    arm: with-only
  - name: first-screen-and-template
    type: llm
    weight: 2
    focus: {source: file, path: examples/getting_started.ipynb}
    criteria: >-
      Context: the text below is a Jupyter notebook (.ipynb JSON) introducing qlsolve, a library whose solve(A, b, shots=None, seed=None) emulates an HHL quantum linear solver. PASS if all three hold: (1) within the first three cells, one visible code cell (not marked source_hidden) contains the import of qlsolve, the definition of A and b, and the call to solve, with no long theory section before it; (2) the notebook has a separate code cell meant for the reader's own system that uses variable names distinct from the main example (for example my_A and my_b) and runs without relying on the example's variables; (3) near that template, text states the input requirements: a real symmetric matrix whose dimension is a power of two up to 16 (MAX_DIM), and a nonzero real vector of matching length. FAIL if any of the three is missing.
  - name: no-fabricated-outputs
    type: regex
    target: {source: file, path: examples/getting_started.ipynb}
    pattern: '"output_type"\s*:\s*"(?:stream|execute_result|display_data)"'
    match: not_contains
  - name: labels-output-quantity-and-mode
    type: llm
    focus: {source: file, path: examples/getting_started.ipynb}
    criteria: >-
      Context: the text below is a Jupyter notebook (.ipynb JSON) for qlsolve. In qlsolve, res.direction is the normalized state x / ||x||, res.solution() returns the physical solution x = norm * direction, res.success_probability is the post-selection probability, and results come either from exact mode (shots=None) or from shot mode, which estimates only the probabilities and has direction None. PASS if every displayed solution vector or probability in the notebook is labeled with the quantity it is (normalized direction or state, physical solution x, or measurement probabilities), with no normalized direction presented as "the solution x", and the notebook says which mode (exact or shots) produced the displayed results. FAIL otherwise.
  - name: reports-execution
    type: llm
    criteria: >-
      Context: in this environment the agent could read and write files but could not execute any code, so no notebook cell could be run. PASS if the final response says that the notebook has not been executed, or that any outputs it contains were not produced by running its cells. FAIL if it claims or implies that the notebook's outputs come from running it, or says nothing about execution.
