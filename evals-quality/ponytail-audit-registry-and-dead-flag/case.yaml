schema_version: "1.1"
name: ponytail-audit-registry-and-dead-flag
description: >-
  Repo-wide Ponytail audit of a small MaxCut package with decorator-registered algorithms, an unread CLI flag, a hand-rolled LRU memo and an unused dependency, testing the compact tagged format and tracing registration before calling code dead.
tags: [quality, tier3, ponytail-audit]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    /ponytail-audit on this repo please. 只要报告，不要改代码。Tests: `python3 -m unittest`.
graders:
  - name: loads-ponytail-audit
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?ponytail-audit"'
    min: 1
  - name: reads-ponytail-audit
    type: tool_used
    tool: Read
    input_match: 'skills/ponytail-audit/SKILL\.md'
    min: 1
    arm: with-only
  - name: tagged-finding-with-path
    type: regex
    pattern: '(?:delete|stdlib|native|yagni|shrink)\W{0,3}:[^\n]*\[[^\]\n]*\.(?:py|txt|toml|cfg)[^\]\n]*\]'
    flags: i
    match: contains
  - name: keeps-registered-algorithms
    type: llm
    weight: 2
    criteria: >-
      Context: in the audited package, run_brute and run_anneal are never called by name. They are registered with a @register("brute") / @register("anneal") decorator into qopt.registry.ALGORITHMS, qopt/algorithms/__init__.py imports both modules so that registration happens, and the CLI dispatches with ALGORITHMS[args.algorithm], as documented in the README. PASS if the audit does not recommend deleting run_brute, run_anneal, their modules, the registry, or the registering imports as dead or unused code. FAIL if it recommends deleting any of them on the grounds that nothing calls them.
  - name: finds-dead-flag-and-dependency
    type: llm
    criteria: >-
      Context: the audited CLI defines --legacy-mode with argparse but never reads args.legacy_mode, and requirements.txt lists six>=1.16, which no file imports. PASS if the audit flags --legacy-mode as having no effect and recommends removing it (a deprecation step first is fine), and recommends removing the six dependency. FAIL if it misses either one.
  - name: stdlib-lru-cache
    type: llm
    criteria: >-
      Context: qopt/cache.py defines a class Memo, a hand-written least-recently-used memo built on OrderedDict with a maxsize of 4096, used only to wrap the pure function _cut_value(edges, bits) whose arguments are tuples. PASS if the audit recommends replacing Memo with functools.lru_cache (or functools.cache). FAIL if it does not mention Memo or recommends keeping it without a reason.
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
