schema_version: "1.1"
name: trigger-route-negative-comment-typos
description: >-
  Fixing typos in docstrings of numerical code changes nothing the code computes, so the scientific code route must not load the correctness skill.
tags: [quality, trigger, trigger-negative, scientific-computing-correctness]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    There are two spelling mistakes in the docstrings of polyevo/plan.py ("aproximation" and "canot"). Please fix them and leave the changes uncommitted. Reply in one line.
graders:
  - name: fixes-the-typos
    type: regex
    pattern: 'aproximation|canot'
    match: not_contains
    target:
      source: file
      path: polyevo/plan.py
  - name: skips-correctness-skill
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?scientific-computing-correctness"'
    min: 0
    max: 0
    arm: both
  - name: skips-ponytail
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?ponytail"'
    min: 0
    max: 0
    arm: both
