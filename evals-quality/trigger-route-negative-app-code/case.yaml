schema_version: "1.1"
name: trigger-route-negative-app-code
description: >-
  A command-line flag and money rounding in an office invoicing tool are ordinary application code, so the scientific code route must not load the correctness skill.
tags: [quality, trigger, trigger-negative, scientific-computing-correctness]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 16
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Our invoicer prints totals like 7.000000000000001. Please print amounts with two decimals and add a --currency flag that puts a symbol in front of them, defaulting to "$". Leave the changes uncommitted. You can't run code here. Reply in two lines.
graders:
  - name: adds-the-flag
    type: regex
    pattern: '--currency'
    target:
      source: file
      path: invoicer/__main__.py
  - name: skips-correctness-skill
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?scientific-computing-correctness"'
    min: 0
    max: 0
    arm: both
  - name: skips-library-review
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?scientific-library-review"'
    min: 0
    max: 0
    arm: both
