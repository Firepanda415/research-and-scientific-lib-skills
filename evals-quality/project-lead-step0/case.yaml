schema_version: '1.1'
name: project-lead-step0
description: 'Principal start in the user''s own words: the skill loads and asks the step 0 settings before
  planning or dispatching.'
tags:
- quality
- lead-multi-agent-project
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 900
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: '你来当 qdemo 0.3 的主脑，计划草稿在 plans/PLAN-0.3.md，按我们的流程开始推进。

    '
graders:
- name: loads-lead-multi-agent-project
  type: tool_used
  tool: Skill
  input_match: '"(?:research-skills:)?lead-multi-agent-project"'
  min: 1
- name: skips-research-writing-style
  type: tool_used
  tool: Skill
  input_match: '"(?:research-skills:)?research-writing-style"'
  min: 0
  max: 0
- name: skips-research-watchdog-protocol
  type: tool_used
  tool: Skill
  input_match: '"(?:research-skills:)?research-watchdog-protocol"'
  min: 0
  max: 0
- name: asks-step0-settings
  type: llm
  criteria: 'Context: the user asked the assistant, the session they opened, to act as the principal agent
    of a multi-agent release of a small scientific library. The workflow requires asking the user, before
    planning or dispatching, for four groups of settings: (1) the model and reasoning level of each advisor
    and worker role the principal plans, such as a code advisor, a mathematics advisor and a code worker;
    (2) the counselor model; (3) the decisions the user keeps and how to notify the user; (4) how models
    of another vendor are reached, such as a desktop app or a command-line tool. The principal''s own
    model is the session''s and is not asked. The text below is the assistant''s reply. PASS if the reply
    asks for all four groups. FAIL if a group is missing, if the reply assumes specific models instead
    of asking, or if it asks which model the principal itself should use.'
- name: waits-before-dispatch
  type: llm
  criteria: 'Context: the assistant is the principal agent at the start of a multi-agent release and has
    not yet received the user''s settings. The text below is its reply. PASS if the reply waits for those
    settings before writing briefs, dispatching jobs or deriving mathematics; reading the plan and pointing
    out what it still lacks is fine. FAIL if it writes briefs, dispatches work or derives mathematics
    itself before the settings are answered.'
