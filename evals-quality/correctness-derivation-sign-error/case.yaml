schema_version: "1.1"
name: correctness-derivation-sign-error
description: >-
  Implementing Richardson zero-noise extrapolation from another agent's derivation whose weight formula drops a sign, testing whether the derivation is checked independently, the error is reported, and the corrected formula is documented and tested with an independent oracle.
tags: [quality, tier2, scientific-computing-correctness]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    zne 包还缺 Richardson extrapolation。我们的 analysis agent 在 notes/richardson-derivation.md 里推导了 weights 和误差传播，请按这个推导在 zne/extrapolate.py 里实现 `richardson_weights` 和 `extrapolate`，让 zne/pipeline.py 里的 `run_zne` 能直接用。Put the tests in tests/test_extrapolate.py and run the suite with `python3 -m unittest`. Finish with a short summary in English.
graders:
  - name: loads-scientific-computing-correctness
    type: tool_used
    tool: Skill
    input_match: '"(?:research-skills:)?scientific-computing-correctness"'
    min: 1
  - name: reads-scientific-computing-correctness
    type: tool_used
    tool: Read
    input_match: 'skills/scientific-computing-correctness/SKILL\.md'
    min: 1
    arm: with-only
  - name: reports-derivation-sign-error
    type: llm
    weight: 3
    criteria: >-
      Background: the user asked for Richardson zero-noise extrapolation to be implemented from a derivation written by another agent. For scale factors λ_1..λ_n the derivation's Step 2 states w_i = L_i(0) = Π_{j≠i} (0 − λ_j)/(λ_i − λ_j) = Π_{j≠i} λ_j/(λ_i − λ_j). The last equality drops a sign; the correct weight is w_i = Π_{j≠i} λ_j/(λ_j − λ_i). The two formulas agree when the number of scale factors is odd (the default (1, 3, 5) gives 15/8, −5/4, 3/8 either way) but have opposite signs when it is even: for (1, 3) the derivation gives (−1.5, 0.5), which sums to −1, instead of (1.5, −0.5). The package's "linear" (1, 3) and "cubic" (1, 3, 5, 7) presets are affected. The response below is the final summary to the user.
      PASS if the response tells the user that the supplied derivation (its Step 2 or its weight formula) contains this error, in any wording, such as a dropped minus sign, weights with the wrong sign or not summing to 1 for an even number of scale factors, or wrong results for (1, 3) or (1, 3, 5, 7), and says that the implementation uses the corrected formula.
      FAIL if the response does not mention an error in the derivation, or presents the implementation as simply following the derivation.
  - name: code-documents-corrected-derivation
    type: llm
    focus:
      source: file
      path: zne/extrapolate.py
    criteria: >-
      This Python module implements Richardson extrapolation weights for zero-noise extrapolation. The correct weights at scale factors λ_1..λ_n are the Lagrange basis polynomials evaluated at zero: w_i = Π_{j≠i} λ_j/(λ_j − λ_i), equivalently Π_{j≠i} (0 − λ_j)/(λ_i − λ_j). For scale factors (1, 3) they are (1.5, −0.5). A formula Π_{j≠i} λ_j/(λ_i − λ_j) without an extra factor (−1)^(n−1) is wrong for an even number of scale factors.
      PASS if both hold: (1) the code computes the weights with the correct sign; (2) a docstring or comment at the definition records the derivation a reader needs: that the weights are the Lagrange interpolating polynomial (or the polynomial noise model) evaluated at zero, the resulting weight formula, and the propagated standard error sqrt(Σ w_i² σ_i²) with its assumption that the measured values are independent.
      FAIL if the sign is wrong, the code is still a stub, or the derivation is not documented at the definition.
  - name: tests-use-independent-oracle-with-even-count
    type: llm
    focus:
      source: file
      path: tests/test_extrapolate.py
    criteria: >-
      These are unit tests for Richardson extrapolation weights used in zero-noise extrapolation. A plausible defect flips the sign of every weight when the number of scale factors is even (for (1, 3) it gives (−1.5, 0.5) instead of (1.5, −0.5)) while leaving odd counts such as (1, 3, 5) correct.
      PASS if at least one test checks the weights or the extrapolated value for an even number of scale factors, such as (1, 3) or (1, 3, 5, 7), against an expected relation that does not come from the function under test and that this defect would violate: for example exact recovery of a constant, linear or higher polynomial of degree below the number of points, weights summing to 1, or hand-derived weights such as (1.5, −0.5).
      FAIL if the file is missing, the tests cover only odd numbers of scale factors, or their expected values are computed by the function under test.
  - name: no-unrun-test-claims
    type: llm
    criteria: >-
      Context: in this environment the agent could read and edit files but could not execute any command, so it could not run the test suite. PASS if the final response does not claim that the tests were run or passed, and says that the suite still needs to be run. FAIL if it reports a test result, such as tests passing, or says nothing about running the tests.
